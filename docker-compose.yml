# Cap each container's json-file log at 3 x 10 MB, as the monitoring stack on
# this box does (buoy-fish/monitoring, ADR-0023 D6). Docker's default never
# rotates, and a full disk here also takes down Prometheus and Alertmanager.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    logging: *default-logging
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto:/mosquitto/data
    networks:
      - internal
    restart: unless-stopped

  postgres:
    logging: *default-logging
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: lorawan
      POSTGRES_USER: lorawan
      POSTGRES_PASSWORD: lorawan
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorawan -d lorawan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  analyzer:
    logging: *default-logging
    build: .
    ports:
      - "15337:3000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./public:/app/public:ro
      - ./data:/app/data
    environment:
      CONFIG_PATH: /app/config.toml
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

networks:
  internal:
